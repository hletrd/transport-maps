# calibration.toml
#
# Calibration constants for the air, rail, ferry, ground, urban and land-border
# models. Each table's comment says whether it is FITTED (and against what) or a
# published-figure default -- the CLAUDE.md modelling rule, checked by
# tests/test_calibration_provenance.py. This file contains NO flight records
# from any provider -- only regression outputs. See the licence firewall note
# in the design spec.
#
# The airborne coefficients below are FITTED, from adsb.lol (ODbL-1.0) daily
# globe history. Only regression outputs are stored here; no flight record is.

[meta]
calibrated = true
source = "adsb.lol globe_history v2026.09.07-planes-readsb-prod-0.tar"
licence = "ODbL-1.0"
sample_size = 107366
holdout_mae_min = 9.3
# Median signed bias by distance bucket, predicted minus observed (minutes):
#   150-400 +2   400-800 +3   800-1500 +0   1500-3000 -1   3000-6000 +6
# VALID RANGE 150-6000 km. Beyond that the fit is EXTRAPOLATION: oceanic gaps
# in receiver coverage trip the 900 s split rule, so a transpacific flight
# arrives as fragments and only 2 of 107,366 legs exceed 6000 km. Long-haul
# is also inherently +/-1 h on winds alone, which a distance-only symmetric
# model cannot represent. Treat 10,000 km+ figures as approximate.
#
# The [airborne] table below is the FITTED output of that sample; [meta]
# records the fit itself.

[airborne]
# airborne_min = climb_descent_penalty_min + 60 * distance_km / cruise_kmh
climb_descent_penalty_min = 15.0
cruise_kmh = 844

# Published-figure defaults (typical block-time components by airport size);
# not fitted.
[taxi_out_min]
large = 17.0
medium = 12.0
small = 8.0

# Published-figure defaults (typical block-time components by airport size);
# not fitted.
[taxi_in_min]
large = 9.0
medium = 6.0
small = 4.0

# Hand-fitted to two anchors (ICN-NRT ~120/wk, ICN-LHR ~14/wk); no
# observed-frequency refit has been done (calibrate/fit.py's fit_frequency
# exists but has no data to run on). Details below.
[frequency]
# Gravity model for weekly frequency on a route that is known to exist:
#   flights_per_week = max(MIN_FLIGHTS_PER_WEEK,
#                          base * size_weight[dep] * size_weight[arr]
#                              * max(distance_km, KNEE_KM) ^ decay)
# KNEE_KM is `knee_km` and MIN_FLIGHTS_PER_WEEK is `min_flights_per_week`,
# both at the end of this table. graph/air.py reads them from here. They
# lived in graph/air.py until task B2 (2026-10-02), with the same values.
# The coefficients are a hand fit, not a regression: no observed-frequency
# refit has been done, and no observed frequency is ever written to dist/.
# Fitted to two real-world anchors: ICN-NRT (1,258 km) runs about 120 flights/week
# and ICN-LHR (8,880 km) about 14. Sanity across the range: Seoul-Jeju (450 km,
# the world's busiest route) -> 362/week vs ~500 real; a 13,800 km ultra-long-haul
# -> 8.4/week vs ~7 real. Transatlantic trunks like LHR-JFK come out low (23 vs ~90)
# because they are frequency outliers for their distance; only a refit against
# observed frequencies would move them, and none has been done.
#
# Do NOT use a shallow decay here. An earlier draft used base=42, decay=-0.35, which
# produced 1.5-5 flights/week for EVERY route on Earth -- Seoul-Jeju at 5/week -- so
# every flight cost 17-56 hours of expected waiting and the whole map was nonsense.
base = 300000.0
decay = -1.10
# NOT fitted, and not a published figure either: a bound on the model, chosen
# so that no fitted anchor moves. The decay exponent is negative, so
# `distance_km ** decay` diverges as distance goes to zero. With the old 1 km
# floor, the 2.8 km Westray-Papa Westray hop came out at 6,041 flights a week
# and a 1-minute expected wait, against a real ~14 a week and ~6 hours. 400 km
# is the same as a ceiling of 412 flights a week for a large-large pair
# (12 minutes' expected wait), which no real route beats by much. It sits
# below every anchor, so none of them moves: ICN-CJU 361.9/wk, ICN-NRT
# 116.8/wk, ICN-LHR 13.6/wk. Do NOT raise it past ~450. At 500 km the knee
# clamps Seoul-Jeju and drags a fitted anchor from 361.9 down to 322.3.
knee_km = 400.0
# NOT fitted: a floor on the ultra-long-haul tail, one flight a fortnight. It
# first binds at 14,395 km for a small-small pair, so it never meets the knee.
min_flights_per_week = 0.5

# Published-figure defaults; not fitted.
[frequency.size_weight]
large = 1.0
medium = 0.55
small = 0.25

# Airport time is split into what depends on the AIRPORT and what depends on the
# ROUTE, because the two are charged in different places.
#
# Processing and disembark sit on the cell<->airport edges, which are built
# before any journey is known, so they must hold only trip-independent time.
# Border control depends on whether a particular flight crosses an immigration
# zone, which IS knowable per flight edge -- so it is charged there instead.
# Previously all of it was lumped together and the international figure applied
# everywhere, which taxed a Gimpo-Haneda shuttle and a Frankfurt-Munich hop
# alike for a border one barely notices and the other never crosses.

# Check-in, bag drop, security, walk to gate, boarding. Scales with terminal
# size, which is the usable proxy for queue length. Published-figure default;
# not fitted.
[processing_min]
large = 70.0
medium = 55.0
small = 40.0

# Deplane, walk, and wait at the belt. No border component. Published-figure
# default; not fitted.
[disembark_min]
large = 30.0
medium = 22.0
small = 15.0

# Carry-on only: the airport time a traveller with no checked bag does not
# spend. NOT applied by the graph -- every map and band assumes a checked bag.
# The page subtracts it from the journey on screen when the visitor asks for
# carry-on only, and says that the map underneath still assumes a bag.
#
# Published-figure defaults, not fitted; each is derived from ONE source:
#
#   departure_saving_min = 15. IATA Global Passenger Survey 2024 (press release
#     2024-10-30): 70% of passengers want to reach the gate within 30 minutes
#     with only a carry-on; 74% expect no longer than 45 minutes with a checked
#     bag. The difference between the two thresholds is taken as the bag-drop
#     share. They are EXPECTATIONS, not measured times, and are labelled so.
#     Charged once, at the first departure airport: a bag is checked through a
#     connection, so connections save nothing.
#   arrival_saving_min = 10. India's BCAS directive to airlines, February 2024:
#     first bag on the belt within 10 minutes of engine shutdown, last within
#     30. A carry-on traveller can leave as the first bags appear (10); a
#     traveller with a bag waits, on average, for the midpoint (20). Charged
#     once, at the final arrival airport. One regulator's standard, applied
#     worldwide: a documented, reproducible error rather than a hidden one.
#
# Neither is split by airport size: neither source is, and inventing a split
# would be exactly the silent tuning this file exists to prevent.
[carry_on]
departure_saving_min = 15.0
arrival_saving_min = 10.0

# Emigration on departure plus immigration on arrival, charged ONCE on a flight
# edge and only when it leaves the departure airport's immigration zone.
# Schengen counts as a single zone: an Amsterdam-Milan flight crosses a national
# border but no immigration desk. Published-figure default; not fitted.
#
# Since A15 (2026-10-02, takes effect with the next full build after rebuild
# 27) it is charged once per AIRSIDE journey, not once per crossing flight: a
# Seoul -> Narita -> Frankfurt transit pays it on the flight into Narita and
# nothing more, because the traveller never leaves the transit area. Where
# the zone admits every arriving passenger (the US, graph/transfers.py
# NO_AIRSIDE_TRANSIT), and on any landside connection, the next crossing pays
# again. The figures below are unchanged and still unfitted; what changed is
# how often a journey pays them (graph/build.py, `_air_edges`). The zone
# memberships (Åland, Monaco, San Marino, the Vatican; the Crown
# Dependencies; Ercan) moved the same day, each sourced in graph/transfers.py.
[border_min]
large = 45.0
medium = 35.0
small = 25.0

# Minimum connection time: published-figure defaults (typical MCTs by airport
# size); not fitted. Nothing in the repo observes connections.
[connection_min]
large = 75.0
medium = 50.0
small = 35.0

# Rail. The SPEEDS ARE FITTED; the boarding and alighting figures are
# published-figure defaults. This table used to say "NOT fitted: OSM route
# relations carry the stop sequence but no journey times, so there is nothing
# here to regress against." That was wrong. 2,448 of the 19,297
# `type=route, route=train` relations in the seven extracts carry a `duration`
# tag, in exactly the formats `sources/osm.parse_minutes()` already parses for
# ferries -- an order of magnitude more observations than the eight published
# headways the ferry wait model was fitted on.
#
# ---- what it replaced, and why ----
#
# There were two speeds on Earth: 200 km/h if the relation carried
# `highspeed=yes` or `service=high_speed`, 75 otherwise. The SELECTOR is the
# defect. Measured over all 19,297 relations, `highspeed=yes` is on 1%
# worldwide and 0% outside Europe, and `service=high_speed` on 1.8%. So a
# Shinkansen and a Tokyo commuter train were the same train, and a suburban
# stopper and an intercity express were both "conventional at 75".
#
# ---- the model ----
#
#   edge_min = stop_overhead_min + 60 * chord_km * detour_factor / speed_kmh
#
# charged per LEG, so a journey over n calls pays n overheads. The overhead is
# not a decoration: fitted without it, implied speed inside a single tier
# drifts by a factor of two with route length (`regional` runs 39 km/h over
# 0-20 km and 70 km/h over 150-400 km), which is a fixed per-call cost --
# decelerate, dwell, accelerate -- being spread over distance. Same structure
# as `[ferry]`'s `berth_min`, and the ordering it produces is physically
# coherent rather than noise: 1.32 min for a commuter call, 5.11 for a
# high-speed one, because a train decelerating from 300 km/h and back costs
# minutes that one decelerating from 80 does not.
#
# ---- the fit (rebuild 22; REFITTED for rebuild 30, see below) ----
#
# Fitted by least squares on log residuals (the ferry precedent) over the
# 2,338 relations whose `duration` parses, whose stop sequence the extracts
# resolve WHOLE (a route the extracts truncate has a chord sum that does not
# correspond to its tagged duration), and whose implied speed lies inside
# 3-350 km/h. That last filter excludes 15 observations, 0.6%: two Polish
# relations tagged `duration=2` for 70 km, four tagged 40-57 h for 38-53 km.
# Reproduce with `sources/osm.rail_routes()` joined to the relations' own tags.
#
#   tier             n   overhead   speed   med pred/obs  log-sd  within 2x
#   high_speed      57     5.11     214.7       0.99       0.156     100%
#   long_distance  228     3.90     103.9       1.07       0.299      96%
#   regional       497     2.22      86.7       1.02       0.437      95%
#   default        717     2.46      81.8       1.08       0.619      85%
#   commuter       716     1.32      73.8       1.05       0.363      97%
#   tourism         25     0.90      20.1       1.01       1.027      73%
#
# Bootstrap 95% CI on speed (2,000 resamples): high_speed [208, 225],
# long_distance [93, 112], regional [80, 92], default [75, 85],
# commuter [59, 77]. A 70/30 holdout over 40 repeats reproduces the in-sample
# log-sd to within 0.03 in every tier, so this is not overfitting.
#
# Against the whole 2,338, including the 15 the fit excluded:
#
#                    med pred/obs   log-sd   within 2x   within 1.5x
#   old, two speeds      0.74        0.592      81%          57%
#   new, six tiers       1.04        0.476      93%          82%
#
# and the distance bias -- the part that mattered -- is gone:
#
#   chord km      n    old    new
#      0-20     431   0.51   1.04
#     20-50     651   0.65   1.03
#    50-150     650   0.79   1.05
#   150-400     315   1.11   1.09
#  400-1000     241   1.14   1.05
#    1000+       50   1.02   0.96
#
# The old model was TWICE TOO FAST on a short ride. Both anchors this table
# used to quote improve, and neither is in the fit set: Seoul-Busan KTX
# (325 km great-circle, published 135 min) was 117 and is now 129 over four
# legs; CFL Luxembourg -> Wasserbillig (28.7 km, timetable ~30 min) was 28 and
# is 28 over two legs.
#
# ---- tiers that do NOT get their own fit ----
#
# `national` (n=44), `international` (n=16) and `night` (n=8) all fit, but
# their overhead is unidentifiable -- the bootstrap CI spans [0, 5] or pins at
# zero -- so rather than invent a constant each is folded into the tier that
# prices its observations best: national -> long_distance (median
# predicted/observed 1.17, against 1.28 as regional and 1.40 as default),
# international -> long_distance (0.96), night -> default (0.96, against 0.77
# as long_distance), suburban (n=4) -> commuter (1.02). `car_shuttle` (n=4)
# stays at default: n=4 cannot choose between default (1.24) and
# long_distance (1.06), and five relations worldwide do not justify a special
# case. The mapping lives in `sources/osm._TIER_BY_SERVICE`.
#
# ---- the honest part: the fit set is 74% European ----
#
# 1,724 of 2,331 clean observations are European, against Asia 373, Oceania
# 109, South America 71, North/Central America 35, Africa 11. `long_distance`
# and `high_speed` are fitted on European observations almost exclusively (216
# of 228 and 55 of 57). Median implied speed per tier DOES vary by region:
#
#   tier            Africa   Asia   Europe   N/C.America   Oceania   S.America
#   default            -      59      49          58          45         -
#   commuter           -      61      50           -          43        37
#   regional           -       -      62           -          70        31
#
# so a commuter figure fitted at 73.8 is up to 30% wrong in South America.
# NO PER-REGION SPEEDS ARE FITTED. n is far too small outside Europe, and
# fitting them would be exactly the hidden error the CLAUDE.md modelling rule
# forbids -- "prefer a documented, reproducible error over a hidden one". The
# skew is recorded here instead so a reader knows which way the number leans.
#
# One thing the skew does NOT damage: `default`, which is the tier that prices
# North America (85% of its relations carry no `service` tag at all), is fitted
# on a near-even Asia/Europe split, 339 and 328.
#
# `tourism` keeps its own tier despite n=25 and a log-sd of 1.03, because every
# alternative is a factor of two too fast (0.44-0.55) and the direction of the
# error is the safe one: a heritage railway Dijkstra declines to select is
# correct behaviour. The weak residual is declared rather than hidden.
#
# ---- what the tiers do NOT fix, measured ----
#
# The tier is only as good as the tag, and where the tag is absent the tier is
# `default`. That is 26.7% of relations worldwide and it includes flagship
# high-speed lines. Measured, not supposed: ALL THREE Shinkansen-named
# relations in the Asia extract carry neither `service` nor `highspeed`.
#
# Relation 9326156, 東北新幹線（下り）: 21 stops, 650 km of chord, 20 legs.
#
#   old model, 75 km/h                     10.4 h
#   this model, tier `default` (81.8)      10.4 h   <-- UNCHANGED
#   this model if it were tiered high_speed 5.3 h
#   published Tokyo -> Shin-Aomori          ~3.1 h
#
# The tiers buy NOTHING here, and the arithmetic says why: 20 legs x 2.46 min
# of `default` overhead almost exactly cancels the gain from 75 to 81.8 km/h.
# What this work fixed is the other 98% of the network -- short stopping
# services, 85% of all legs, which the old model ran twice too fast -- and it
# left the case the review lane raised exactly where it found it. Said plainly
# here because a table of improved residuals would otherwise imply otherwise.
#
# Two separate causes, and only one of them is a tagging problem:
#
# 1. THE SIGNAL IS ON THE WAYS, NOT THE RELATIONS. In the Asia extract alone,
#    of 987,441 `railway=rail|light_rail|narrow_gauge` ways, 108,970 (11.0%)
#    carry `highspeed=yes` and 295,676 (29.9%) carry `maxspeed`, whose commonest
#    values include 350, 300 and 250. The relations carrying the same
#    information: zero. Reading it means collecting each relation's WAY members
#    and a third pass over 4.2 GB of PBF, then refitting -- deferred rather than
#    rushed alongside a 1,464-origin build that has already died twice.
#
# 2. OSM MODELS THE ALL-STATIONS PATTERN, AND THE EXPRESS IS NOT A SEPARATE
#    RELATION. `ride_edges` resolves parallel services by `min(minutes)`, which
#    is the right rule and needs a faster relation to select. The Tohoku
#    relation lists 21 calls; the Hayabusa that runs it in 3 h 10 calls at
#    about six. So even tiered `high_speed` the model charges 20 x 5.11 min of
#    station overhead and lands at 5.3 h. No amount of speed calibration
#    reaches 3.1 h from a 21-stop stop sequence, and nothing in this file
#    should be read as claiming it does.
#
# ---- rebuild 30: the track, read (2026-10-14) ----
#
# Both causes above are now addressed, from the member ways and the track
# themselves (`sources/rail_track.py`):
#
# 1. A relation with NO usable `service` tag is promoted to `high_speed` when
#    at least half its member track is high-speed (`highspeed=yes` or
#    `maxspeed` >= 200) and its own line speed averages 200 or more. A tag is
#    never overridden: promoting on track share alone took 1,009 relations,
#    among them S-Bahn services tagged `commuter` on German 200 km/h lines.
#    All twenty Shinkansen relations, the THSR and the Hokuriku/Joetsu
#    services are now `high_speed`.
# 2. Where the relations do not carry a high-speed line -- mainland China,
#    above all -- it is built from the track: stations on high-speed track,
#    the track length between neighbours, the time at line speed. An EXPRESS
#    network: a ride pays boarding and running time, no intermediate stops.
#    That is the long-distance service on such a line; it is optimistic by the
#    dwell of the few stops a real express makes and by the one arrival
#    overhead the express does not pay here (the relation fit puts it at
#    4.5 min). On track a high-speed relation already runs over, its stops
#    are the stations; elsewhere a station is the one nearest each switch.
#    2,391 links, 131,600 km of track, in the rebuild-29 extracts.
# 3. The same for fast CONVENTIONAL track (rebuild 33): running line of
#    160-200 km/h (`rail_track.FAST_MIN_KMH`) that no relation runs over is
#    built into links the same way, but priced as one `long_distance` leg
#    by that tier's line terms below, not as an express. 814 links, 25,530
#    km of track in the rebuild-32 extracts: China 22,217 km (670 stations,
#    where OSM lists almost no conventional trains), Spain 1,152, Italy 626,
#    Tanzania 423, Hungary 298, Bulgaria 217, Romania 200, Israel 124. None in
#    India, Britain, Japan or Korea, whose fast lines relations already cover.
#
# The refit, `scripts/fit_rail_tiers.py --refit --vmax`, over the same
# extracts: 2,376 relations with a usable `duration`, 2,360 inside the
# plausibility band, now tiered AS THE GRAPH PRICES THEM (promotion moved the
# fast untagged services out of `default`, which is why `default` fell below
# `commuter` and the tier order changed):
#
#   tier             n   overhead   speed   med pred/obs  log-sd  within 2x
#   high_speed      97     4.84     220.8       0.99       0.175     98%
#   long_distance  293     2.62      95.8       1.07       0.310     96%
#   regional       516     2.17      85.9       1.04       0.305     96%
#   commuter       741     1.29      73.1       1.03       0.223     97%
#   default        686     2.15      71.4       1.09       0.462     91%
#   tourism         27     1.34      21.7       1.10       0.610     78%
#
#   whole set: med pred/obs 1.03, log-sd 0.343, 95% within 2x, 85% within 1.5x
#
# THE LINE'S OWN SPEED. A tier is one speed for every line it covers, and
# the track says how fast each line is. On the relations whose member track
# has a `maxspeed` over at least `line_speed_min_cover` of its length, the
# running speed `line_speed_factor x` the length-weighted harmonic mean of
# that `maxspeed`, with its own per-stop overhead, fits better than the tier
# in every tier but one (same observations, same criterion):
#
#   tier             n   tier sd   line sd   factor  95% CI          overhead
#   high_speed      92    0.144     0.152    0.994   [0.956, 1.037]    4.57
#   long_distance  261    0.287     0.219    0.701   [0.666, 0.739]    0.67
#   regional       471    0.258     0.242    0.709   [0.671, 0.748]    1.07
#   default        364    0.424     0.367    0.691   [0.651, 0.734]    0.96
#   commuter       617    0.199     0.175    0.789   [0.739, 0.831]    1.13
#   tourism          8    0.485     0.303    0.546   [0.451, 0.683]    0.00
#
# So it is used for the four tiers it improves and that have the
# observations: NOT `high_speed`, where one speed fits better (its lines are
# all built to much the same standard), and NOT `tourism`, on n=8. A UK
# 125 mph intercity (Avanti, `long_distance`, ~200 km/h line speed) now runs
# at ~140 km/h rather than the tier's 96.
# (Superseded in rebuild 33 by the per-leg price under [rail.tiers]; the
# table above is kept as the record of why line speed was adopted.)
#
# THE TRACK NETWORK'S FACTOR. On `high_speed` relations with mapped line
# speed (n=92), `duration` against `legs x overhead + 60 x member_km /
# vmax / factor`: factor 0.881, bootstrap 95% CI [0.848, 0.915], log-sd
# 0.145, median predicted/observed 1.00.
[rail]
# Track is never a great circle: curves, valleys and junctions. Applied to the
# straight-line distance between consecutive stops. NOT refitted here -- it was
# held at 1.2 while the tier speeds were fitted, so the speeds absorb any error
# in it and the two must not be read separately.
detour_factor = 1.2
# Charged ONCE per journey on the cell -> station edge, not per hop, so riding
# through twenty intermediate stops is not taxed twenty times. Published-figure
# defaults, not fitted: OSM carries nothing about station access time. Note
# that the two TOGETHER are 20 minutes -- three surfaces used to say 15.
boarding_min = 15.0
alighting_min = 5.0
# FITTED (rebuild 30, above): running speed on the track network's links as a
# share of line speed. n=92 high_speed relations, CI [0.848, 0.915]. Links
# charge no intermediate stop: a fitted share of the high_speed tier's stop
# cost per link was worse out of fold on the 29 timetabled relations that
# re-ride the network (median |log| 0.164 vs 0.070; sources/rail_track.py).
track_speed_factor = 0.881
# A relation's own line speed is used when `maxspeed` is mapped on at least
# this share of its member track. A modelling threshold, NOT fitted: below
# half, the mean speaks for part of the route only. The line-speed fits above
# are on exactly the relations this admits.
line_speed_min_cover = 0.5

# EACH LEG ITS OWN TRACK (rebuild 33). A line is not one speed: the KTX via
# Suwon runs 111 km of 150 km/h conventional line inside a relation whose
# track averages 196, and a Komachi's Akita end is 130 km/h mini-shinkansen.
# So a relation leg whose own track is known (`rail_track.leg_profiles`: the
# member ways chained, each stop placed on them) and has `maxspeed` over
# `line_speed_min_cover` of it is priced from that track:
#
#   minutes = line_overhead_min + line_stop_loss_min * v/100
#             + 60 * km / (line_speed_factor * v + line_speed_floor_kmh)
#
# with km the leg's track length and v its length over its hours at mapped
# maxspeed (unmapped km at the relation's line speed). A leg with no profile
# runs the same formula on the chord x `detour_factor` at the relation's line
# speed, or its tier speed when that is not mapped either. 229,333 of 242,778
# relation legs are profiled, 143,107 with maxspeed over half their track.
#
# Which terms a tier carries is chosen OUT OF FOLD, not by eye:
# `scripts/fit_rail_tiers.py --legs`, the same 2,360 relations, five folds
# grouped by service (operator + ref or name), least squares on log(pred/obs).
# Structures: L (factor, overhead), S (+ stop loss growing with speed), C (+
# speed floor), SC (both), each at the line speed and at `maxspeed:tilting`
# (t). The rule (`_choose`): lowest out-of-fold log-sd, ties within 0.002
# go to the fewest terms, then the lower median; tilting only where strictly
# better than line speed. Median |log p/o| / log-sd:
#
#   tier            n  rebuild 30    L            S            C            SC      chosen
#   high_speed     97  0.086/0.189  0.063/0.170  0.050/0.164  0.072/0.178  0.050/0.164  S
#   long_distance 293  0.103/0.252  0.110/0.255  0.107/0.252  0.110/0.251  0.109/0.250  S t (0.105/0.251)
#   regional      516  0.128/0.289  0.142/0.300  0.126/0.287  0.121/0.285  0.122/0.284  C
#   commuter      741  0.101/0.205  0.106/0.205  0.090/0.194  0.096/0.198  0.090/0.194  S
#   default       686  0.193/0.427  0.184/0.419  0.183/0.417  0.183/0.417  0.183/0.417  L
#
# ("rebuild 30" is the one-line-speed-per-relation model refitted on the same
# folds.) Out of fold the gain is real for high_speed and commuter, small for
# regional and default, and nil for long_distance -- whose leg pricing is
# still what moves London-Manchester and Delhi-Agra (the check pairs, below:
# CHECKS, never fitted on). The stop term growing with speed is what the old
# model could not express: its log residuals ran against log line speed with
# slopes of -0.27 to -0.31 in every tier.
#
# Every tier below is FITTED. `speed_kmh` is the running speed applied to the
# great-circle chord between consecutive stops after `detour_factor`;
# `stop_overhead_min` is charged once per leg; both price a leg whose line
# speed is unknown. The `line_*` terms are the formula above, with a 95%
# bootstrap interval over services (200 resamples). This header is written
# out rather than left implicit because tomllib sees `rail.tiers` as a table
# either way, and test_header_regex_sees_every_table_tomllib_sees pins the
# provenance regex against tomllib's view precisely so an implicit parent
# cannot slip through unlabelled.
[rail.tiers]

# FITTED (rebuild 30), n=97: median predicted/observed 0.99, log-sd 0.175,
