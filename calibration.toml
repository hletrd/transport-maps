# FITTED (rebuild 30), n=27, and still the weakest number in this file: median
# 1.10, log-sd 0.610, 78% within 2x. Kept as its own tier because every
# alternative is a factor of two too fast and the error direction is the safe
# one: a heritage railway Dijkstra declines to select is correct behaviour.
# No line-speed terms on n=8.
[rail.tiers.tourism]
speed_kmh = 21.7
stop_overhead_min = 1.34

# Ferries. A MIXTURE, and each figure below says which it is.
#
# What this table replaced, and why. It used to hold two numbers -- a 35 km/h
# published cruise speed and a 30-minute terminal time -- and that was the
# whole ferry model: `60*km/35 + 30`. There was no frequency and no expected
# wait anywhere in the repository, so the Staten Island Ferry and the
# twice-yearly Cape Town-Tristan da Cunha sailing were charged the same
# half hour of waiting. Against eight published headways the error ran from
# +7 minutes to -689 hours, median about -47 hours; on a band ladder whose
# ratio is 1.1526 that is six to fifteen bands of visibly wrong colour, worst
# in exactly the polar and remote places a travel-time map is most asked about.
#
# ---- sailing time: FITTED, against 3,203 OSM `duration` tags ----
#
# sailing_min = berth_min + 60 * km / speed_kmh
#
# Fitted by iteratively reweighted least squares over every `route=ferry` way
# in the seven Geofabrik extracts that carries a parseable `duration` and whose
# endpoints are 1-4,000 km apart: 3,203 observations. Reproduce with
# `graph/ferry.trusted_duration_min` over `sources/osm.ferry_links()`.
#
# Residuals: median predicted/observed 1.00, log-sd 0.469 (x1.60 at one sigma),
# 86.0% within a factor of two. By distance bucket, median predicted/observed,
# against the same column for the OLD 35 km/h model:
#
#        km       n   observed   fitted   old 35 km/h
#      1-10    1456     20 min     1.07          0.34
#     10-50     958     60 min     0.92          0.60
#    50-150     413    200 min     0.93          0.72
#   150-400     253    570 min     0.93          0.75
#  400-1000     101   1200 min     1.07          0.88
# 1000-4000      22   2280 min     1.03          0.85
#
# The old model was three times too fast on a short crossing and about 15%
# too fast on a long one. A `detour_factor` like `[rail]`'s was tried first and
# rejected: fitted per bucket it ran from 2.90 at 1-10 km to 1.18 above
# 1,000 km, because the short-range excess is a per-crossing overhead
# (manoeuvring out of the harbour and berthing at the far side), not
# tortuosity. Giving that overhead its own term is what flattens the residual.
#
# `duration` is PREFERRED over this model wherever a way carries a parseable
# one, so the fit only prices the crossings that have no timetable. Coverage
# rises with distance -- 7.4% under 1 km to 66.7% above 1,000 km -- so the
# measured value is available most often where the model would be least sure.
#
# ---- expected wait: FITTED, against eight published headways ----
#
# interval_h = interval_base_h * max(km, KNEE_KM) ** interval_decay
# sailings_per_week = max(MIN_SAILINGS_PER_WEEK,
#                         (10080 / interval_min) * service_fraction)
# expected_wait_min = (10080 / sailings_per_week) / 2
#
# The two bounds are NOT in this file: KNEE_KM = 8 km and
# MIN_SAILINGS_PER_WEEK = 0.1 live in graph/ferry.py, with the derivation of
# each. Said explicitly because the [frequency] table above used to document an
# unbounded equation that was not the one the model applied (its bounds moved
# into it in task B2), and this table is not going to repeat that.
#
# The anchors, all published operator headways:
#
#   Staten Island Ferry                8 km      0.4 h
#   Dover-Calais                      42 km      1.5 h
#   Helsinki-Tallinn                  82 km      3 h
#   Naples-Palermo                   315 km     24 h
#   Arctic Umiaq Line                372 km    168 h
#   Torshavn-Seydisfjordur (Norrona) 508 km    168 h
#   Alaska Marine Highway,
#     Whittier-Yakutat               513 km    168 h
#   Cape Town-Tristan da Cunha     2,793 km  ~1,251 h
#
# Fit quality on the anchors: R-squared 0.942 in log space, log-residual sd
# 0.679, i.e. a factor of 1.97 at one sigma. Per anchor, predicted/published:
# 0.52, 1.70, 2.34, 2.25, 0.41, 0.66, 0.67, 1.17.
#
# Two objections the cycle-8 critic raised against this fit, recorded here and
# not overruled (c8 T1.9, the two its first pass left out; C13-11 / V13-3):
#
# - It fixes only 41% of the Greenland error. On the Arctic Umiaq Line the
#   prior predicts a 69 h interval against the published 168 h, so it charges
#   35 h of the 84 h expected wait. Door to door, that leg went from 11 h 08
#   to 48 h 09 against a published 97 h 28, and 49 h are still unpriced.
# - Three of the eight anchors (Umiaq, Norrona, Whittier-Yakutat) share the
#   same 168 h, a weekly sailing, within 141 km of each other (372-513 km).
#   They carry the exponent. Refit without them, the decay falls from 1.514
#   to 1.401 and the 372 km interval from 69 h to 43 h. Three operators' habit
#   of sailing weekly therefore sets the 150-500 km band's wait.
#
# ---- the honest part: an independent holdout, and it is not flattering ----
#
# 326 of the ferry ways carry a parseable `interval` tag, which is an
# independent sample the fit never saw. Against those the prior is much worse
# than against its own anchors: median predicted/observed 0.383, log-sd 1.267
# (x3.55 at one sigma), only 23.3% within a factor of two and 56.1% within
# four. And the bias has a SIGN that flips with distance:
#
#        km      n   median observed   predicted/observed   wait error
#      1-10    191            1.0 h                 0.21       -0.4 h
#     10-50     83            1.5 h                 0.54       -0.3 h
#    50-150     24           14.0 h                 0.58       -3.9 h
#   150-400     19           15.5 h                 2.21       +7.3 h
#  400-1000      8          126.0 h                 1.68      +10.9 h
# 1000-4000      1          168.0 h                 2.35     +113.7 h
#
# Below about 150 km the prior claims more frequent service than reality; above
# it, less. That is not noise, it is the model's real limitation: DISTANCE
# ALONE CANNOT TELL A REMOTE LIFELINE ROUTE FROM A BUSY SHORT-SEA ONE. The
# anchors in the 150-500 km band are deliberately remote (Greenland, the
# Faroes, the Alaska panhandle) while OSM's tagged crossings in that band are
# mostly Mediterranean and East Asian and run several times a day. Fed the
# 170 km Dalian-Yantai crossing -- out of a departure city, with roughly
# hourly sailings -- the prior invents about 10 hours of waiting.
#
# This error is left DOCUMENTED rather than corrected, which is the CLAUDE.md
# rule: "prefer a documented, reproducible error over a hidden one." Refitting
# to the 326 observed intervals would swap one bias for another -- 191 of them
# are sub-10 km river ferries and exactly ONE is over 1,000 km, so the remote
# long-range regime the map was most wrong about would be fitted on a single
# point. The anchors cover that regime; the holdout does not.
#
# Three things bound the damage. Where a way carries an `interval`, that value is
# used and the prior is not consulted at all. Where it does not but the
# crossing is one of the busy corridors the 2026-10-14 audit found charged
# hours of phantom waiting (Hong Kong-Macau, Helsinki-Tallinn, Dover-Calais,
# Dar es Salaam-Zanzibar, Wellington-Picton), the operators' published
# timetable is used instead: graph/ferry.py PUBLISHED_HEADWAYS, each row a
# cited, dated published figure and not a constant tuned to a route. And the error's magnitude follows
# the wait: at short range a factor of five is minutes, which no band boundary
# notices, while the hours-scale errors sit at 150 km and beyond where the
# previous model was wrong by days.
#
# One asymmetry to keep in mind when reading the table above: UNDER-charging is
# loud (a route appears faster than it is, and someone notices) while
# OVER-charging is SILENT -- Dijkstra simply stops selecting the edge, the
# ferry channel empties, and no gate in this repository looks at that. The
# +7 to +11 hour rows are therefore the ones to watch.
#
# ---- seasonality: published-figure defaults, not fitted ----
#
# `service_fraction` is the share of the YEAR a crossing runs, from the
# `seasonal` and `opening_hours` tags, parsed in sources/osm.py: three months
# per named season, five months for a bare `seasonal=yes`, and an explicit
# month range taken literally. 240 crossings get a fraction below 1.0. The map
# carries no date, so "leave now" can only be answered as a year average.
# Restriction within the DAY or the WEEK is not modelled at all -- 879 ways
# carry a day-conditional `opening_hours` and evaluating that expression needs
# a parser this repository does not have. `24/7` is honoured as the one value
# that positively says service is continuous. Both tags are absent above
# 400 km, so none of this touches the long crossings.
[ferry]
# FITTED (see above). The published cruise figure this replaced was 35 km/h,
# about 19 knots; the fit says 29.1 km/h once the per-crossing overhead is
# charged separately, and the pair together track observation far better than
# either alone.
speed_kmh = 29.1
# FITTED (see above). Casting off, harbour manoeuvring and berthing: the part
# of a scheduled sailing that does not scale with distance.
berth_min = 11.2
# Published-figure default, not fitted. Vehicle and foot loading either side of
# the scheduled sailing -- NOT the wait for it, which is now charged separately
# and was what this number was quietly standing in for.
terminal_min = 30.0
# FITTED to the eight published headways above. Hours, for a crossing of 1 km;
# only meaningful together with the exponent and the 8 km knee.
interval_base_h = 0.008915
interval_decay = 1.5137

# Ground speed per road class, in km/h: GRIP4's class 0 roadless, 1 highway,
# 2 primary, 3 secondary, 4 tertiary, 5 local, and class 6, a cell an
# OpenStreetMap motorway crosses (graph/ground.MOTORWAY_CLASS,
# sources/motorways.py). A MIXTURE. One key per class rather than an array:
# tests/test_licence_firewall.py refuses any list in this file, because a
# list is what a dump of records would look like.
#
# Classes 1-4 and 6 (42.9, 47.7, 56.6, 34.6; 82.0 where no limit is signed,
# [ground_motorway] by signed limit) are FITTED -- jointly with
# [ground_income], [ground_region], `end_min` below and [urban]
# built_up_factor -- against
# 1,396 real driving journeys from Google Routes (scripts/calibrate_ground.py,
# 2026-10-15): the 750 town journeys of the rebuild-30 fit plus 646 from the
# centres of 150 cities of 1 M or more (to their airport, to towns 15-150 km
# out and one 5-15 km out). The target is Google's TYPICAL-TRAFFIC time for
# a Tuesday 10:00 (local solar time) departure, `duration` of a TRAFFIC_AWARE
# request: the map's time is door to door, and a traveller meets daytime
# traffic. The fit minimises squared LOG error with the four strata (metro,
# intercity, rural, airport access) weighted equally; structures are chosen
# by five-fold cross-validation by source. These are the speeds of an
# upper-middle-income country; [ground_income] scales all five.
#
# Class 6 came in at rebuild 32. GRIP4 grades a modern expressway and an old
# national highway alike, so expressway corridors in lower-middle-income
# countries read slow (rebuild 31: Cairo -> Alexandria 252 min of ground
# against Google's 151). Which OSM ways count was chosen out of fold with the
# speeds, each candidate scored on the paths it gives (mean of the strata's
# median |log|): highway=motorway alone, 0.138, planned once at a
# provisional 95 km/h; plus trunk tagged motorway=, expressway= or
# motorroad=yes, 0.133 after one re-plan under its own fit; plus trunk
# signed 100 km/h or more, 0.127 after two -- sources/motorways.RULE =
# "fast_trunk", whose last round moved no constant by more than 3%. It tied
# (0.132 each) in the first round and led after. Income-scaled like the rest
# (0.127) against one speed everywhere (0.142).
#
# Out of fold, median |log(observed/predicted)| (and median ratio):
#   stratum    rebuild 31 (no class 6)   this fit
#   metro      0.147 (0.98)              0.131 (0.98)
#   intercity  0.135 (0.95)              0.089 (0.97)
#   rural      0.149 (1.01)              0.135 (0.99)
#   airport    0.177 (0.99)              0.153 (0.97)
# Both columns out of fold on the same 1,396 journeys, each on its own
# model's paths. Merging class 6 back into class 1 on the new paths scores
# 0.146 / 0.102 / 0.142 / 0.180: the gain is the class, not the routing.
#
# Checked, never fitted (scripts/ground_pairs.py; ground minutes, rebuild 31
# -> this fit, Google typical traffic): Cairo -> Alexandria 252 -> 214 (151),
# Delhi -> Agra 283 -> 221 (204), Los Angeles -> San Diego 165 -> 157 (123),
# Chicago -> Milwaukee 120 -> 108 (93), Mumbai -> Pune 176 -> 171 (161),
# Lagos -> Ibadan 154 -> 137 (129), Mexico City -> Puebla 129 -> 117 (142,
# now fast). The airport runs move the other way: London -> LHR 34 -> 31
# (51), Paris -> CDG 36 -> 35 (48), New York -> JFK 36 -> 33 (48), Tokyo ->
# NRT 78 -> 73 (84), with the end minutes (13.8 -> 11.4) and the built-up
# factor (1.39 -> 1.36) both refitted lower. Metro airport runs stay the
# largest open error.
#
# Class 1 is now what GRIP4 calls a highway and OSM does not call a motorway
# or a fast trunk -- largely the old national roads and city cells -- which
# is why it fits below primary. Classes 0 and 5 (5 and 25) are
# published-figure defaults, not fitted: roadless drew almost no distance
# across these journeys and local 0.3%, too little to support a fit
# (calibrate/ground.FIXED_CLASSES).
#
# `end_min` = 11.4 is FITTED with the speeds: the minutes every road journey
# pays at its two ends -- out of a street onto the network and back, and the
# kilometres the hex path cuts across where a real road winds. Without it the
# residual followed length in every stratum (rebuild 31: rural journeys of
# 30-80 km 1.28, over 200 km 0.97), which is a constant per journey and no
# per-kilometre speed. Half is added at the departure door and half at the
# arrival cell of every solve (service/bundle.with_end_minutes), and half to
# each airport kerb on the access and egress edges (graph/build.
# _access_edges), so a drive to an airport pays it like any other.
#
# Rebuild 33 (2026-10-15) refitted all of [ground], [ground_income],
# [ground_motorway], [ground_region] and [urban] built_up_factor on the same
# 1,396 journeys and target, re-planned under the structure below (graph/
# ground.cell_class's trunk floor in the paths; two rounds, the second moving
# no constant by more than 3%). Three structural changes, each chosen out of
# fold (scripts/calibrate_ground.py journeys, five folds by source):
#   * motorways priced by their signed limit ([ground_motorway]), not one
#     speed: mean of the strata's median |log| 0.119 -> 0.110;
#   * a North America multiplier ([ground_region]): North American journeys
#     sat at 0.92 observed/predicted in sample with one high-income
#     multiplier; an East Asia one fitted at 1.01 and is not kept;
#   * lower_middle and low as one multiplier (they fitted 0.813 and 0.824 apart,
#     71 low-income journeys; tied they score 0.1102 against 0.1110).
# Tried and not kept: a penalty by GRIP4 road density (sources/roads.
# cell_road_density; factors 0.90-1.05, no gain), one by city size, a factor
# for the city core alone, and motorways exempt from the built-up penalty
# (0.1106 against 0.1110: a tie, so the penalty stays as it was).
#
# Out of fold, median |log(observed/predicted)| (median ratio), rebuild 32's
# structure on its own paths against this fit on its own:
#   stratum    rebuild 32      rebuild 33
#   metro      0.131 (0.98)    0.113 (0.98)
#   intercity  0.089 (0.97)    0.074 (1.00)
#   rural      0.135 (0.99)    0.095 (0.99)
#   airport    0.153 (0.97)    0.156 (0.97)
#
# Checked, never fitted (scripts/ground_pairs.py, ground minutes, rebuild 32
# -> rebuild 33; Google typical traffic): Cairo -> Alexandria 214 -> 193
# (151), Los Angeles -> San Diego 157 -> 140 (123), Chicago -> Milwaukee 108
# -> 102 (93), Mexico City -> Puebla 117 -> 124 (142), Tokyo -> NRT 73 -> 84
# (84), London -> LHR 31 -> 35 (51), Paris -> CDG 35 -> 37 (48), New York ->
# JFK 33 -> 33 (48), Lagos -> Ibadan 137 -> 146 (129), Mumbai -> Pune 171 ->
# 174 (161). Tawau -> TWU stays 224 min for 27 km: Natural Earth's coast
# severs three of the six edges of the town's cell (east, north-east and
# north), and neither a fixed link nor a road crossing rejoins them, so the
# path runs 145 km round inland. Why road_crossings misses the coast road is
# not yet traced. The city-centre
# airport runs of London, Paris and New York stay the largest error: their
# hex paths run motorway cells straight across the city, and nothing the
# sample carries -- road density, city size, core distance -- separates them
# from the city journeys the fit gets right.
#
# Read by graph/ground.py (SPEED_BY_ROAD_CLASS_KMH, END_MINUTES). The sampled
# journeys stay in data/build/ and nothing from them reaches dist/.
[ground]
roadless_kmh = 5.0       # class 0, published-figure default
highway_kmh = 42.9       # class 1, FITTED
primary_kmh = 47.7       # class 2, FITTED
secondary_kmh = 56.6     # class 3, FITTED
tertiary_kmh = 34.6      # class 4, FITTED
local_kmh = 25.0         # class 5, published-figure default
motorway_kmh = 82.0      # class 6 with no signed limit, FITTED ([ground_motorway])
end_min = 10.8           # per journey, both ends together, FITTED

# Free-flow speed multiplier per World Bank income group, applied to classes
# 1-4 and 6 (graph/ground.cell_speed_kmh); the group comes from each cell's
# country (Natural Earth admin-0 INCOME_GRP, its two high-income groups
# merged: sources/countries.INCOME_GROUPS). FITTED with [ground] above. The
# same grade of road is driven at different speeds: with one speed per class
# the rebuild-30 fit was 23% too slow on North American town journeys and 24%
# too fast in low-income countries. upper_middle is the reference, 1 by
# definition; a motorway is 102 km/h in a high-income country and 71 in a
# low-income one.
[ground_income]
high = 1.055             # FITTED
upper_middle = 1.0       # the reference
lower_middle = 0.815     # FITTED, one multiplier with low (see [ground])
low = 0.815              # FITTED, one multiplier with lower_middle

# A motorway cell (class 6) priced by its signed limit: the highest OSM
# maxspeed among the motorway ways crossing it (sources/motorways.
# motorway_limit), in bands under 95, 95-115 and 115 km/h or more
# (LIMIT_BANDS_KMH); a cell no crossing way signs is [ground] motorway_kmh.
# FITTED with [ground] (rebuild 33, see there). Upper-middle-income speeds;
# [ground_income] and [ground_region] scale them like the other classes.
[ground_motorway]
under_95_kmh = 73.6      # FITTED
from_95_kmh = 89.1       # FITTED
from_115_kmh = 102.4     # FITTED

# Speed multiplier for a driving region (sources/countries.DRIVING_REGIONS:
# north_america = USA and Canada), on top of [ground_income], applied to the
# same classes. FITTED with [ground] (rebuild 33): with one high-income
# multiplier, North American journeys came out 9% too slow in sample (median
# observed/predicted 0.917) while Europe's sat at 0.98; an East Asia
# multiplier was tried and fitted at 1.01, so it is not kept.
[ground_region]
north_america = 1.231    # FITTED

# The built-up areas, from Natural Earth populated places of `pop_min` or more
# (`pop_max`; sources/urban.py).
#
# `radius_km` = 40 decides which base cells are split to the finer grid
# (graph/refine.dense_mask). FITTED in 2026-09 jointly with the then penalty
# (112 city-to-airport and 1,383 inter-town journeys, which put 5.7% of land
# in it); it governs resolution only.
#
# `built_up_factor` = 1.36 is the penalty: a cell with roads closer to a city
# than `built_up_extent` = 1.0 of that city's built-up radii is slowed by the
# factor (graph/ground.py). The radius is the disc the city's population fills
# at sources/roads.SETTLED_DENSITY_PER_KM2 (4,200 per km2, Demographia World
# Urban Areas 2023, a published figure): 3.9 km at 200,000, 8.7 km at 1 M,
# 27 km at 10 M. FITTED with [ground] above, structure and value: the extent
# was chosen out of fold from 0.5-3 radii and against rebuild 30's flat 20 km
# (which left London's outer half at highway speed), and a separate
# highway factor or one per city size bought nothing (rebuild 31; with the
# motorway class, a separate factor for classes 1 and 6 scored 0.127 against
# 0.127).
# GRIP4 grades a cell by the best road inside it, so a dense city cell with a
# motorway through it is charged near motorway speed; the factor stands for
# the streets a journey actually takes there.
#
# The masks' caches key on pop_min, the density and their geometry.
[urban]
pop_min = 200000.0
radius_km = 40.0
built_up_factor = 1.354  # FITTED
built_up_extent = 1.0    # city built-up radii, FITTED (structure)

# Crossing a land border. Charged on the ground edge between two cells whose
