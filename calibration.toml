# calibration.toml
#
# Calibration constants for the air, rail, ferry and land-border models. Each
# table's comment says whether it is FITTED (and against what) or a
# published-figure default -- the CLAUDE.md modelling rule, checked by
# tests/test_calibration_provenance.py. This file contains NO flight records
# from any provider -- only regression outputs. See the licence firewall note
# in the design spec.
#
# The airborne coefficients below are FITTED, from adsb.lol (ODbL-1.0) daily
# globe history. Only regression outputs are stored here; no flight record is.

[meta]
calibrated = true
source = "adsb.lol globe_history v2026.09.07-planes-readsb-prod-0.tar"
licence = "ODbL-1.0"
sample_size = 107366
holdout_mae_min = 9.3
# Median signed bias by distance bucket, predicted minus observed (minutes):
#   150-400 +2   400-800 +3   800-1500 +0   1500-3000 -1   3000-6000 +6
# VALID RANGE 150-6000 km. Beyond that the fit is EXTRAPOLATION: oceanic gaps
# in receiver coverage trip the 900 s split rule, so a transpacific flight
# arrives as fragments and only 2 of 107,366 legs exceed 6000 km. Long-haul
# is also inherently +/-1 h on winds alone, which a distance-only symmetric
# model cannot represent. Treat 10,000 km+ figures as approximate.
#
# The [airborne] table below is the FITTED output of that sample; [meta]
# records the fit itself.

[airborne]
# airborne_min = climb_descent_penalty_min + 60 * distance_km / cruise_kmh
climb_descent_penalty_min = 15.0
cruise_kmh = 844

# Published-figure defaults (typical block-time components by airport size);
# not fitted.
[taxi_out_min]
large = 17.0
medium = 12.0
small = 8.0

# Published-figure defaults (typical block-time components by airport size);
# not fitted.
[taxi_in_min]
large = 9.0
medium = 6.0
small = 4.0

# Hand-fitted to two anchors (ICN-NRT ~120/wk, ICN-LHR ~14/wk); no
# observed-frequency refit has been done (calibrate/fit.py's fit_frequency
# exists but has no data to run on). Details below.
[frequency]
# Gravity model for weekly frequency on a route that is known to exist:
#   flights_per_week = max(MIN_FLIGHTS_PER_WEEK,
#                          base * size_weight[dep] * size_weight[arr]
#                              * max(distance_km, KNEE_KM) ^ decay)
# The two bounds are NOT in this file: KNEE_KM = 400 km and
# MIN_FLIGHTS_PER_WEEK = 0.5 live in graph/air.py, and the unbounded equation
# written here was not the one the model applies. KNEE_KM caps the short-range
# blow-up (below 400 km the pure power law runs away); MIN_FLIGHTS_PER_WEEK
# floors the ultra-long-haul tail. Moving either into this file is task B2.
# The coefficients are a hand fit, not a regression: no observed-frequency
# refit has been done, and no observed frequency is ever written to dist/.
# Fitted to two real-world anchors: ICN-NRT (1,258 km) runs about 120 flights/week
# and ICN-LHR (8,880 km) about 14. Sanity across the range: Seoul-Jeju (450 km,
# the world's busiest route) -> 362/week vs ~500 real; a 13,800 km ultra-long-haul
# -> 8.4/week vs ~7 real. Transatlantic trunks like LHR-JFK come out low (23 vs ~90)
# because they are frequency outliers for their distance; only a refit against
# observed frequencies would move them, and none has been done.
#
# Do NOT use a shallow decay here. An earlier draft used base=42, decay=-0.35, which
# produced 1.5-5 flights/week for EVERY route on Earth -- Seoul-Jeju at 5/week -- so
# every flight cost 17-56 hours of expected waiting and the whole map was nonsense.
base = 300000.0
decay = -1.10

# Published-figure defaults; not fitted.
[frequency.size_weight]
large = 1.0
medium = 0.55
small = 0.25

# Airport time is split into what depends on the AIRPORT and what depends on the
# ROUTE, because the two are charged in different places.
#
# Processing and disembark sit on the cell<->airport edges, which are built
# before any journey is known, so they must hold only trip-independent time.
# Border control depends on whether a particular flight crosses an immigration
# zone, which IS knowable per flight edge -- so it is charged there instead.
# Previously all of it was lumped together and the international figure applied
# everywhere, which taxed a Gimpo-Haneda shuttle and a Frankfurt-Munich hop
# alike for a border one barely notices and the other never crosses.

# Check-in, bag drop, security, walk to gate, boarding. Scales with terminal
# size, which is the usable proxy for queue length. Published-figure default;
# not fitted.
[processing_min]
large = 70.0
medium = 55.0
small = 40.0

# Deplane, walk, and wait at the belt. No border component. Published-figure
# default; not fitted.
[disembark_min]
large = 30.0
medium = 22.0
small = 15.0

# Emigration on departure plus immigration on arrival, charged ONCE on a flight
# edge and only when it leaves the departure airport's immigration zone.
# Schengen counts as a single zone: an Amsterdam-Milan flight crosses a national
# border but no immigration desk. Published-figure default; not fitted.
[border_min]
large = 45.0
medium = 35.0
small = 25.0

# Minimum connection time: published-figure defaults (typical MCTs by airport
# size); not fitted. Nothing in the repo observes connections.
[connection_min]
large = 75.0
medium = 50.0
small = 35.0

# Rail. Pre-calibration defaults from published timetables, NOT fitted: OSM
# route relations carry the stop sequence but no journey times, so there is
# nothing here to regress against. Anchor used for the high-speed figure:
# Seoul-Busan KTX is 417 km of track in 2 h 15 (185 km/h average including
# intermediate stops); 325 km great-circle x 1.2 detour / 200 km/h = 117 min
# against a real 135, so the model runs slightly optimistic on high-speed.
# The conventional figure checks out against real OSM data end to end: CFL
# Luxembourg -> Sandweiler-Contern -> Wasserbillig comes out at 29 min from
# the parsed stop sequence, against roughly 30 min in the timetable.
[rail]
highspeed_kmh = 200.0
conventional_kmh = 75.0
# Track is never a great circle: curves, valleys and junctions. Applied to the
# straight-line distance between consecutive stops.
detour_factor = 1.2
# Charged ONCE per journey on the cell -> station edge, not per hop, so riding
# through twenty intermediate stops is not taxed twenty times.
boarding_min = 15.0
alighting_min = 5.0

# Ferries. Published-figure defaults: a typical vehicle ferry cruises about
# 19 knots (35 km/h), and terminal time covers arriving ahead of the sailing,
# loading and unloading. Charged once per crossing.
[ferry]
speed_kmh = 35.0
terminal_min = 30.0

# Crossing a land border. Charged on the ground edge between two cells whose
# countries sit in different immigration zones, the same test the air model
# applies -- so Schengen and the Common Travel Area cost nothing, and the
# Johor causeway, the Tijuana crossing and the Dover ferry all pay. A
# published-figure default, not fitted: Singapore-Johor alone ranges from
# twenty minutes to two hours by time of day. Closed borders are not slowed,
# they are cut (sources/countries.py).
[land_border]
crossing_min = 45.0
