<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Isochronic Passage Chart — travel time to anywhere on Earth</title>
<meta name="description" content="How many hours it takes to reach any point on Earth from 157 cities, by air, rail and road. An isochrone world map recomputed from open data, after Francis Galton's isochronic passage chart of 1881.">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Dataset",
      "@id": "https://worldmap.atik.kr/#dataset",
      "name": "Global travel-time isochrones from 157 cities",
      "description": "Expected door-to-door travel time from each of 157 origin cities to every land area on Earth, combining scheduled air routes, ground transport speed derived from road density, and transfer penalties. Distributed as PMTiles isochrone bands plus a per-origin binary time array on an H3 resolution-5 grid.",
      "url": "https://worldmap.atik.kr/",
      "keywords": ["isochrone", "travel time", "accessibility", "world map", "H3", "PMTiles", "aviation", "geography"],
      "spatialCoverage": { "@type": "Place", "name": "Earth" },
      "measurementTechnique": "Single-source Dijkstra over a multi-modal graph of 548,557 hexagonal land cells and 3,983 airports",
      "creator": { "@type": "Person", "name": "Jiyong Youn" },
      "isBasedOn": [
        "https://ourairports.com/data/",
        "https://www.openstreetmap.org/copyright",
        "https://www.globio.info/download-grip-dataset",
        "https://www.naturalearthdata.com/"
      ],
      "license": "https://opendatacommons.org/licenses/odbl/1-0/"
    },
    {
      "@type": "WebApplication",
      "name": "Isochronic Passage Chart",
      "applicationCategory": "https://schema.org/TravelApplication",
      "operatingSystem": "Any modern web browser",
      "browserRequirements": "Requires WebGL",
      "url": "https://worldmap.atik.kr/",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "about": { "@id": "https://worldmap.atik.kr/#dataset" }
    }
  ]
}
</script>

<link href="./vendor/fonts.css" rel="stylesheet">
<link href="./vendor/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  --paper:#efe7d9; --paper-2:#e9e0d0; --rule:#c3b49a; --rule-2:#d9ccb5;
  --ink:#241a12; --ink-2:#5f4f40; --ink-3:#8b7862;
  --b0:#6c0e00;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"EB Garamond",Georgia,"Times New Roman",serif;
  font-size:16px;line-height:1.45;font-variant-numeric:oldstyle-nums;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo,.maplibregl-ctrl-bottom-right{display:none!important}

/* Panels are folded by default; the chart is the page. */
.panel{
  position:fixed;z-index:5;background:var(--paper);
  border:1px solid var(--rule);
}
summary{
  list-style:none;cursor:pointer;padding:9px 15px;
  font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-2);
  font-variant-numeric:lining-nums;white-space:nowrap;
  display:flex;align-items:baseline;gap:9px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--ink-3);font-size:14px;line-height:1}
details[open] > summary::after{content:"−"}
summary:hover{color:var(--ink)}
details[open] > summary{border-bottom:1px solid var(--rule-2)}
.body{padding:13px 15px 15px}

/* Masthead — quiet, top-left. */
.mast{
  position:fixed;top:22px;left:26px;z-index:6;max-width:23ch;
}
.mast h1{margin:0;font-size:23px;font-weight:400;line-height:1.15;letter-spacing:.004em}
.mast p{margin:5px 0 0;font-size:12px;font-style:italic;color:var(--ink-2);line-height:1.45}

/* Reading — the number the chart exists to give. Always visible. */
.reading{position:fixed;left:26px;bottom:26px;z-index:6}
.reading .v{
  margin:0;font-size:60px;line-height:.95;letter-spacing:-.015em;
  font-variant-numeric:lining-nums tabular-nums;
}
.reading .v small{font-size:19px;font-style:italic;color:var(--ink-2);margin-left:6px}
.reading .at{margin:5px 0 0;font-size:12.5px;color:var(--ink-2);min-height:1.4em}

/* Departure, folded. */
#departure{top:22px;right:22px;width:268px}
.results{list-style:none;margin:9px 0 0;padding:0;max-height:46vh;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.results button{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;color:var(--ink-2);
  font:400 15.5px/1.35 "EB Garamond",Georgia,serif;padding:3px 0;
  display:flex;justify-content:space-between;gap:10px;align-items:baseline;
}
.results button:hover{color:var(--ink)}
.results button[aria-current="true"]{color:var(--b0);font-weight:600}
.results .coord{font-size:11px;color:var(--ink-3);flex:none}
#q{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule);
  color:var(--ink);font:400 15.5px/1.5 "EB Garamond",Georgia,serif;padding:3px 0 6px;outline:none;
}
#q:focus{border-bottom-color:var(--ink)}
#q::placeholder{color:var(--ink-3);font-style:italic}
.here{
  margin:0 0 9px;font-size:11.5px;font-style:italic;color:var(--ink-3);line-height:1.45;
}

/* Key, folded. */
#key{right:22px;bottom:22px;width:268px}
.tints{display:flex;height:12px;border:1px solid var(--rule)}
.tints span{flex:1}
.tints span+span{border-left:1px solid rgba(36,26,18,.09)}
.marks{display:flex;justify-content:space-between;margin-top:4px;font-size:10.5px;color:var(--ink-3)}
#key p{margin:9px 0 0;font-size:11.5px;line-height:1.5;color:var(--ink-2)}
#key .src{margin-top:9px;font-size:10px;color:var(--ink-3);line-height:1.55}

@media (max-width:820px){
  .mast{max-width:none;right:26px}
  #departure{top:auto;bottom:96px;right:14px;left:14px;width:auto}
  #key{right:14px;bottom:14px;left:14px;width:auto}
  .reading{bottom:auto;top:104px;left:26px}
  .reading .v{font-size:44px}
  .results{max-height:32vh}
}
</style>
</head>
<body>
<div id="map" role="img" aria-label="Interactive globe shaded by travel time from the selected departure city"></div>

<header class="mast">
  <h1>Isochronic Passage Chart</h1>
  <p>Hours to reach any point on Earth, by air, rail and road. After Galton, 1881.</p>
</header>

<div class="reading">
  <p class="v" id="time">—</p>
  <p class="at" id="where">Trace the chart to read a passage.</p>
</div>

<details class="panel" id="departure">
  <summary>Departure<span id="origin-name" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)"></span></summary>
  <div class="body">
    <p class="here" id="here"></p>
    <input id="q" type="search" placeholder="Search 157 cities…" autocomplete="off" spellcheck="false" aria-label="Search departure cities">
    <ul class="results" id="results"></ul>
  </div>
</details>

<details class="panel" id="key">
  <summary>Key &amp; sources</summary>
  <div class="body">
    <div class="tints" id="tints"></div>
    <div class="marks"><span>0</span><span>6</span><span>12</span><span>24</span><span>48</span><span>72+ h</span></div>
    <p>Reckoned from a planned departure: the first service is not waited for,
       but onward connections are.</p>
    <p class="src" id="credits"></p>
  </div>
</details>

<noscript>
  <div style="position:fixed;inset:0;background:#efe7d9;z-index:20;padding:40px;max-width:62ch">
    <h1 style="font-weight:400">Isochronic Passage Chart</h1>
    <p>An interactive world map showing how many hours it takes to reach any point
    on Earth from each of 157 cities, combining scheduled flights, road speed and
    transfer times. It needs JavaScript and WebGL to draw the globe.</p>
    <p>Built from open data: OurAirports, Wikipedia, OpenStreetMap, GRIP4 road
    density and Natural Earth. After Francis Galton's isochronic passage chart of 1881.</p>
  </div>
</noscript>

<script type="module" src="./app.js"></script>
</body>
</html>
