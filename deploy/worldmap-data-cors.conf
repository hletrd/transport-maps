# Static, public data may be read by the map without sharing browser cookies.
add_header Access-Control-Allow-Origin "https://worldmap.atik.kr" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "Range, If-Match, Cache-Control, Pragma" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag, Cache-Control, Expires, X-Worldmap-Probe" always;
add_header Access-Control-Max-Age "86400" always;
add_header Timing-Allow-Origin "https://worldmap.atik.kr" always;
add_header X-Robots-Tag "noindex, nofollow" always;
