# Optional CDN route for immutable data. The application and APIs stay on
# worldmap.atik.kr, whose DNS record remains unproxied.
server {
    listen 80;
    listen [::]:80;
    server_name worldmap-data.atik.kr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/worldmap; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    http3 on;
    server_name worldmap-data.atik.kr;

    ssl_certificate /etc/letsencrypt/live/worldmap-data.atik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldmap-data.atik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/worldmap-cloudflare-realip.conf;
    include snippets/worldmap-security-headers.conf;
    root /var/www/worldmap;

    location ^~ /.well-known/acme-challenge/ {
        add_header Cache-Control "no-store" always;
        include snippets/worldmap-security-headers.conf;
    }
    location ~ /\. { return 404; }
    location ~* \.(tmp|part|partial|journal)$ { return 404; }
    location ~* -journal$ { return 404; }

    location = /delivery-probe-v1.bin {
        include snippets/worldmap-security-headers.conf;
        include snippets/worldmap-data-cors.conf;
        add_header Cache-Control $worldmap_release_cache always;
        add_header X-Worldmap-Probe "1" always;
        gzip off;
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD OPTIONS { deny all; }
        try_files $uri =404;
    }
    location ~ ^/data/[A-Za-z0-9_-]+/.*\.(pmtiles|r6\.bin|over\.bin)$ {
        include snippets/worldmap-security-headers.conf;
        include snippets/worldmap-data-cors.conf;
        add_header Cache-Control $worldmap_release_cache always;
        gzip off;
        default_type application/octet-stream;
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD OPTIONS { deny all; }
        try_files $uri =404;
    }
    location ~ ^/data/[A-Za-z0-9_-]+/ {
        include snippets/worldmap-security-headers.conf;
        include snippets/worldmap-data-cors.conf;
        add_header Cache-Control $worldmap_release_cache always;
        gzip on;
        gzip_types application/json application/octet-stream text/plain;
        if ($request_method = OPTIONS) { return 204; }
        limit_except GET HEAD OPTIONS { deny all; }
        try_files $uri =404;
    }
    location / {
        include snippets/worldmap-security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }
}
