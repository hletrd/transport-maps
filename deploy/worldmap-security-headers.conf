# Security headers for worldmap.atik.kr. Included at server level AND inside
# every location that sets its own add_header (Cache-Control), because nginx's
# add_header does not merge across levels: a location with any add_header of
# its own drops every header inherited from the server block. That is how the
# live site served no CSP, HSTS or X-Frame-Options on a single page asset
# while the conf appeared to set them all (review finding E3).
#
# Install as /etc/nginx/snippets/worldmap-security-headers.conf (see
# deploy/README.md), then verify with:  curl -sI https://worldmap.atik.kr/app.js
#
# The CSP allows exactly what the page does at runtime and nothing else:
#   - no blob: in script-src or worker-src. MapLibre GL 5 spawned its workers
#     from blob URLs; MapLibre 6 (vendored since 2026-10-02) loads
#     vendor/maplibre-gl-worker.js as a same-origin module worker, which 'self'
#     covers in both directives (Safari, which reads script-src for workers,
#     included). Dropped 2026-10-06 after a report-only run of this policy on
#     the live page refused nothing in either directive;
#   - the Google tag loader and its inline bootstrap (by hash, so no
#     'unsafe-inline'), with the analytics collection endpoints in connect-src
#     and img-src;
#   - Nominatim for address search and click-to-address.
#   - object-src 'none': no plugins; default-src would otherwise allow same-origin ones.
# No report-to yet: add `Reporting-Endpoints: csp="https://..."` and `report-to csp`
# once a collector exists, so a violation shows up somewhere other than a
# visitor's console. Google signals / ads linking would need
# https://*.g.doubleclick.net and https://*.google.com in connect-src/img-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com 'sha256-c+c+5EEw2ulmGca8fAsTWUnRuZWu2Gax9hYL7W1aiZA='; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Geolocation is offered by a button that starts from the nearest charted city.
#
# The four advertising entries are the page's own claim, enforced. index.html
# says "This site has no accounts, no sign-in and no advertising", and the CSP
# above deliberately withholds the hosts Google signals / ads linking would
# need -- but the Privacy Sandbox advertising APIs are the one advertising
# surface CSP structurally CANNOT reach: browsing-topics reads a topic from
# the browser, attribution-reporting registers a conversion, and
# join-ad-interest-group / run-ad-auction are Protected Audience. All four
# default to an allowlist of `*`, so an analytics tag that began using them --
# or any future script on this origin -- would be inside the CSP and outside
# the promise. `()` is the empty allowlist: not even this document.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), browsing-topics=(), attribution-reporting=(), join-ad-interest-group=(), run-ad-auction=()" always;
