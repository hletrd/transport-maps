# worldmap.atik.kr — static travel-time isochrone globe.
# Self-contained: no CDN, no external fonts, no runtime API calls.
server {
    listen 80;
    listen [::]:80;
    server_name worldmap.atik.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name worldmap.atik.kr;

    ssl_certificate /etc/letsencrypt/live/worldmap.atik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldmap.atik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/worldmap;
    index index.html;

    # Everything is first-party, so the CSP stays tight. blob: is required
    # because MapLibre GL spawns its workers from blob URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Geolocation is used to default the departure to the nearest charted city.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ---------------------------------------------------------------------
    # CACHING. Every file below except the fonts is rewritten by a rebuild,
    # and they must change TOGETHER: app.js addresses elements that only the
    # matching index.html contains, and hover_cells.bin must have exactly as
    # many entries as each origin's .bin. A browser holding one old file and
    # one new one gets a blank globe, which is precisely what shipped before
    # these headers existed. Revalidate them all; ETags make that a 304.
    # ---------------------------------------------------------------------
    location = / {
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache" always;
    }
    location ~* \.(bin|pmtiles)$ {
        add_header Cache-Control "no-cache" always;
        add_header Accept-Ranges bytes always;
        default_type application/octet-stream;
    }
    # Fonts are the one genuinely immutable asset: content-addressed by name
    # and never rewritten by a rebuild.
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json text/plain;
    gzip_min_length 1024;
    # .pmtiles and .woff2 are already compressed.
}
