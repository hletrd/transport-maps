# worldmap.atik.kr — static travel-time isochrone globe.
# No CDN and no external fonts. Two runtime calls leave the browser -- Nominatim
# (address search, on request) and the Google tag -- and the CSP names exactly those.
server {
    listen 80;
    listen [::]:80;
    server_name worldmap.atik.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name worldmap.atik.kr;

    ssl_certificate /etc/letsencrypt/live/worldmap.atik.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worldmap.atik.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/worldmap;
    index index.html;

    # Security headers live in one snippet that is included here AND in every
    # location below: nginx add_header does not inherit into a location that
    # sets any header of its own, so a single Cache-Control line used to
    # silently drop the CSP, HSTS and X-Frame-Options from every page asset.
    include snippets/worldmap-security-headers.conf;

    # ---------------------------------------------------------------------
    # CACHING. Every file below except the fonts is rewritten by a rebuild,
    # and they must change TOGETHER: app.js addresses elements that only the
    # matching index.html contains, and hover_cells.bin must have exactly as
    # many entries as each origin's .bin. A browser holding one old file and
    # one new one gets a blank globe, which is precisely what shipped before
    # these headers existed. Revalidate them all; ETags make that a 304.
    # ---------------------------------------------------------------------
    # certbot's webroot challenge lives under a dotted path; ^~ wins over the
    # regex locations, so the dotfile deny below never sees it.
    location ^~ /.well-known/acme-challenge/ { }
    # An aborted writer's leftovers must never be served: a sqlite journal
    # (origins/las-vegas.pmtiles-journal) was live with a 200 once. The deploy
    # script excludes them and check_dist refuses them; this is the last line.
    # These come BEFORE the extension locations: nginx takes the first regex
    # that matches, so declared later they would lose to `\.json$` for `/.x.json`.
    location ~ /\. { return 404; }
    location ~* \.(tmp|part|partial|journal)$ { return 404; }
    location ~* -journal$ { return 404; }

    location = / {
        add_header Cache-Control "no-cache" always;
        include snippets/worldmap-security-headers.conf;
    }
    # css and png too: maplibre-gl.css is version-coupled to the no-cache
    # maplibre-gl.js, and without a rule of their own they fell through to
    # `location /` with no Cache-Control at all (browser heuristics).
    location ~* \.(html|js|css|json|txt|xml|png)$ {
        add_header Cache-Control "no-cache" always;
        include snippets/worldmap-security-headers.conf;
    }
    # Fetched whole, never by range, and they compress hard: the per-origin
    # time array gives back 30% and the arrival-airport array 78%, because both
    # are uint16 with long runs of near-identical values.
    location ~* \.bin$ {
        add_header Cache-Control "no-cache" always;
        include snippets/worldmap-security-headers.conf;
        gzip on;
        gzip_types application/octet-stream;
        gzip_min_length 1024;
    }

    # PMTiles is read by BYTE RANGE and is already compressed internally.
    # Gzipping it would defeat both: nginx cannot serve a range out of a
    # gzipped response, so the whole archive would come down for every tile.
    location ~* \.pmtiles$ {
        add_header Cache-Control "no-cache" always;
        add_header Accept-Ranges bytes always;
        include snippets/worldmap-security-headers.conf;
        gzip off;
        default_type application/octet-stream;
    }
    # Fonts are the one asset a rebuild never rewrites. They are named by
    # family/subset/weight, NOT by content: bump the filename when Plex is
    # refreshed, or a browser keeps the old face for a year.
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/worldmap-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json text/plain;
    gzip_min_length 1024;
    # .pmtiles and .woff2 are already compressed.
}
