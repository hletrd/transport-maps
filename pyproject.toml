[project]
name = "transport-maps"
version = "0.1.0"
description = "Pipeline for building global travel-time isochrone maps from open geodata"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Jiyong Youn", email = "01@0101010101.com" }
]
requires-python = ">=3.14"
dependencies = [
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "osmium>=4.3.1",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pyogrio>=0.13.0",
    "rasterio>=1.5.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
]

[project.scripts]
transport-maps = "transport_maps.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
markers = [
    "network: hits a live API",
    "real_multi_band: solves a real origin over the full graph (minutes, and needs the built caches)",
    "integration: builds the full node index or graph from the cached universe (minutes each); part of the gate, skippable with -m 'not integration' for a fast loop",
]
# network and real_multi_band are excluded by default so a plain `uv run
# pytest` is the gate; run them on purpose with `-m network` /
# `-m real_multi_band`. `integration` is NOT excluded: the gate is the whole
# suite. --strict-markers turns a mistyped marker into an error instead of a
# silently unfiltered test.
addopts = "--strict-markers -m 'not network and not real_multi_band'"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Ruff 0.16 jumped its default rule count from 59 to 413 with no config
# present, so `ruff check .` used to verdict differently depending on which
# ruff version happened to be installed (0.16+ vs. earlier), or which ambient
# config an environment supplied. `select` REPLACES the default outright
# (unlike `extend-select`), so pinning it here is what makes the result the
# same on every machine from now on.
#
# This is pyflakes + syntax errors + import sorting + pyupgrade (an
# unopinionated, widely-used baseline), plus BLE001 -- already relied on by
# the noqa in sources/landmask.py -- and the specific Ruff/Pylint/Tryceratops
# checks this project's code already satisfies. Deliberately NOT the full
# 413-rule default: that set also includes e.g. mandatory docstring
# formatting (D) and a blanket ban on `assert` in test files (S101), which
# this project's existing style does not follow and was never written for.
select = [
    "E9", "F", "I", "UP",
    "BLE001",   # blind `except Exception` must be justified, not silent
    "PLR1730",  # if/else assignment replaceable by min()/max()
    "RUF007",   # zip(xs, xs[1:]) -> itertools.pairwise(xs)
    "RUF012",   # mutable class-level default needs typing.ClassVar
    "RUF046",   # redundant int() around a call that already returns int
    "TRY004",   # invalid-type branch should raise TypeError
]
